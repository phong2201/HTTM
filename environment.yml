# Env conda cho HUB (backend FastAPI + pipeline data science).
#   conda env create -f environment.yml
#   conda activate hub
# Cập nhật sau khi sửa file: conda env update -f environment.yml --prune
name: hub
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch CUDA 12.4 (chạy cả khi không có GPU). Bản này hỗ trợ NumPy 2.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
      - torchvision==0.20.1
      # Backend
      - -r backend/requirements.txt
      # Data science
      - numpy==2.1.3
      - pandas==2.2.3
      - pyarrow==18.1.0
      - scikit-learn==1.5.2
      - matplotlib==3.9.3
      - seaborn==0.13.2
      - wordcloud==1.9.4
      - nltk==3.9.1
      - beautifulsoup4==4.12.3
      - opencv-python==4.10.0.84
      - pillow==11.0.0
      - tqdm==4.67.1
      - kaggle==1.6.17
      - torch_geometric==2.6.1
      - sentence-transformers==3.3.1
      - transformers==4.46.3
      # Test
      - pytest==8.3.4
