# Env conda cho HUB (backend FastAPI + pipeline H&M Random Forest).
#   conda env create -f environment.yml
#   conda activate hub
# Cập nhật sau khi sửa file: conda env update -f environment.yml --prune
name: hub
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Backend
      - -r backend/requirements.txt
      # Pipeline H&M
      - numpy==2.1.3
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - matplotlib==3.9.3
      - pillow==11.0.0
      - kaggle==1.6.17
      # Test
      - pytest==8.3.4
